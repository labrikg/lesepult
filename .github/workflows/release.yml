# Builds the installers when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0)
# and attaches them to a draft release: a universal macOS .dmg (Apple Silicon + Intel), a Windows
# setup .exe, and Linux .AppImage, .deb and .rpm. Check the draft, write the notes, then publish it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-2022
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: System libraries for Tauri (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # To sign and notarize the macOS app (needs a paid Apple Developer account), add these
          # repository secrets: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID; tauri-action picks them up from the environment.
          # Windows code signing needs a certificate too; see https://tauri.app/distribute/sign/windows/
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Lesepult __VERSION__
          releaseBody: |
            Downloads below: the .dmg for macOS (Apple Silicon and Intel), the -setup.exe for Windows, the .AppImage, .deb or .rpm for Linux.
            The first launch has to be confirmed once: on macOS under System Settings → Privacy & Security ("Open Anyway"), on Windows with "More info" → "Run anyway". See the README.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
