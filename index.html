<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesepult</title>
    <script>
      // Apply the saved theme before the first paint (see src/lib/theme.ts).
      (function () {
        var pref = null, pdf = null, skin = null;
        try {
          pref = localStorage.getItem("lesepult.theme");
          pdf = localStorage.getItem("lesepult.darkPdf");
          skin = localStorage.getItem("lesepult.skin");
        } catch (e) {}
        if (skin && skin !== "lesepult") document.documentElement.dataset.skin = skin;
        var dark = pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.darkPdf = pdf === "on" ? "on" : "off";
        var ua = navigator.userAgent;
        document.documentElement.dataset.os = ua.indexOf("Mac") >= 0 ? "mac" : ua.indexOf("Windows") >= 0 ? "windows" : "linux";
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
